# Converted from the stage specs by onset_blending.legacy_specs.
#   ground_truth: specs/raw_data/ground_truth_template.yml
#   forecast[forecast_model]: specs/raw_data/forecast_template.yml
#   combine: specs/combine/combine_country_template.yml
#   connect: specs/2025_blend/connect_country_template.yml
#   cv_models: specs/2025_blend/cv_models_country_template.yml
#   regrid: specs/regrid/country_template.yml
# Not carried over:
#   - regrid: weights_out (written by result.save)
#   - regrid: centroids_out (written by result.save)
#   - regrid: report_out (written by result.save)
#   - regrid: forecasts[].value_col (it only named a weights file)
#   - ground_truth: input.parallel (a run setting, not part of the blend)
#   - ground_truth: input.workers (a run setting, not part of the blend)
#   - ground_truth: output (derived from the config)
#   - ground_truth: options.fixed_cutoff_month_day (only forecast processing reads it)
#   - ground_truth: filter.centroids_file (the regrid writes it)
#   - ground_truth: paths.climatology_out_dir (derived from the config)
#   - ground_truth: paths.climatology_out_stem (derived from the config)
#   - ground_truth: input.gt_path (derived from the config)
#   - forecast[forecast_model]: input.parallel (a run setting, not part of the blend)
#   - forecast[forecast_model]: input.workers (a run setting, not part of the blend)
#   - forecast[forecast_model]: output (derived from the config)
#   - forecast[forecast_model]: input.wide_prefix (derived from the config)
#   - combine: input.ground_truth_wide_rds (derived from the config)
#   - combine: output (derived from the config)
#   - combine: forecasts.forecast_model.daily[].add_plus (connect never reads the plus columns)
#   - combine: type (no code reads it)
#   - combine: options.plus_label_template (no code reads it)
#   - combine: options.default_prob_col (no code reads it)
#   - combine: climatology.max_day (no code reads it)
#   - combine: climatology.prob_col (no code reads it)
#   - connect: input_rds (derived from the config)
#   - connect: output_rds (derived from the config)
#   - connect: onset_spec 'ground_truth_template' (rain windows now resolve against the one onset definition)
#   - connect: climatology.output_prefix (the climatology features are always prob_clim)
#   - connect: mode (no code reads it)
#   - cv_models: run.MR (no code reads it)
#   - cv_models: run.pipeline_input_dir (derived from the config)
#   - cv_models: run.pipeline_output_dir (set outputs.dir instead)
#   - cv_models: models.window_variants[0] (disabled)
#   - cv_models: extras.forecasts[0].fair_brier (no code reads it)
#   - cv_models: mme.mc_cores (no code reads it)
name: country_template
data_root: ../archive
domain:
  regrid:
    shapefile: Monsoon_Data/reference/example_country/admin_units.shp
    unit_id_col: unit_id
    unit_name_col: unit_name
    grid_lat_var: latitude
    grid_lon_var: longitude
  dissemination:
    file: Monsoon_Data/reference/example_country/dissemination_units.csv
    id_col: unit_id
observations:
  files:
    folder: Monsoon_Data/raw_nc/example_country/ground_truth
    pattern: ^rain_(19|20)\d{2}\.nc$
    years: 2000:2024
  variable: rainfall
  dims:
    latitude: lat
    longitude: lon
    time: time
models:
- name: forecast_model
  files:
    folder: Monsoon_Data/raw_nc/example_country/forecast_model
    pattern: ^forecast_(19|20)\d{2}\.nc$
    years: 2000:2024
  variable: rainfall
  dims:
    latitude: lat
    longitude: lon
    time: time
    lead_time: day
    ensemble: number
  lead_days:
    max: 40
  rain_horizon:
    max_day: 40
    policy: truncate
  rain_predictors:
  - agg: diff
  - agg: min
    window: dry_spell
  - agg: max
onset:
  definition:
    trigger_rule: first_day_wet
    wet_day_comparison: gt
    follow_days: 30
    followup_anchor: onset_day
    dry_spell:
      mode: window_sum
  threshold:
    file: Monsoon_Data/reference/example_country/onset_thresholds.csv
    id_col: unit_id
    value_col: onset_threshold
climatology:
  train_years: 2000:2024
  test_years: 2000:2024
  workers: 4
features:
  rain_transform: fourth_root
evaluation:
  years:
    training: 2000:2024
    cv_holdout: 2000:2024
  formulas:
    blended_model:
      text: outcome ~ prob_clim_qx * diff_forecast_model_qx + min_forecast_model_10day_qx
        + max_forecast_model_5day_qx
  forecasts:
  - model: forecast_model
    variant: fixed_cutoff
    platt_weights: true
  mme:
    sources:
    - name: clim_raw
    - name: forecast_model
      source: forecast
      cal_variant: fixed_cutoff
